<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 viewport-fit=cover">

  <meta name="theme-color" content="#0f3b82">

  <title>BISAMA V2 - Sistem Informasi Magang</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f8fafc;
    }

    #bisamaFrame {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
      background: #ffffff;
    }

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
      font-family: Arial, sans-serif;
      color: #172554;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: #0f3b82;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(15, 59, 130, 0.20);
    }

    .loading-title {
      font-size: 18px;
      font-weight: 700;
    }

    .loading-text {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #dbeafe;
      border-top-color: #0f3b82;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      display: none;
      max-width: 500px;
      margin: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #fecaca;
      font-family: Arial, sans-serif;
      color: #7f1d1d;
      text-align: center;
    }

    .error button {
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      padding: 9px 15px;
      background: #0f3b82;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="loadingScreen">

    <div class="logo">
      B
    </div>

    <div class="loading-title">
      BISAMA V2
    </div>

    <div class="spinner"></div>

    <div class="loading-text">
      Memuat Sistem Informasi Magang...
    </div>

  </div>

  <div id="errorBox" class="error">
    <strong>BISAMA tidak dapat dimuat.</strong>

    <p>
      Periksa koneksi internet atau pastikan URL
      Google Apps Script Web App sudah benar.
    </p>

    <button onclick="location.reload()">
      Muat Ulang
    </button>
  </div>

  <!--
    ==========================================================
    URL GOOGLE APPS SCRIPT WEB APP
    ==========================================================

    GANTI URL DI BAWAH DENGAN URL DEPLOYMENT APPS SCRIPT KAMU.

    Contoh:
    https://script.google.com/macros/s/XXXXXXXXXXXX/exec
  -->

  <iframe
    id="bisamaFrame"
    title="BISAMA V2"
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>


  <script>

    /*
     * ========================================================
     * URL BACKEND / WEB APP BISAMA
     * ========================================================
     *
     * Masukkan URL:
     * Google Apps Script
     * → Deploy
     * → New deployment
     * → Web app
     * → URL yang berakhiran /exec
     */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxtX6JK_TcesuwqxLW7y4EBsSXW-idUD6wbDsNeq97dKYhoJdegF6qVJjgU12ja1wpxMg/exec";


    const frame = document.getElementById("bisamaFrame");
    const loading = document.getElementById("loadingScreen");
    const errorBox = document.getElementById("errorBox");


    /*
     * Validasi URL sebelum iframe dijalankan
     */
    function validUrl(url) {

      return (
        url &&
        url !== "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_DISINI" &&
        /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/i.test(url)
      );

    }


    /*
     * Memuat BISAMA
     */
    function loadBisama() {

      if (!validUrl(APPS_SCRIPT_URL)) {

        loading.style.display = "none";
        frame.style.display = "none";
        errorBox.style.display = "block";

        return;

      }

      frame.src = APPS_SCRIPT_URL;

    }


    /*
     * Ketika halaman BISAMA selesai dimuat
     */
    frame.addEventListener("load", function () {

      setTimeout(function () {

        loading.style.display = "none";
        frame.style.display = "block";

      }, 400);

    });


    /*
     * Jika iframe gagal dimuat
     */
    frame.addEventListener("error", function () {

      loading.style.display = "none";
      frame.style.display = "none";
      errorBox.style.display = "block";

    });


    /*
     * Jalankan
     */
    loadBisama();

  </script>

</body>
</html>
